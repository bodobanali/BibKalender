name: Update library events

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Monat im Format YYYY-MM (leer = aktueller Monat)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            python scrape.py "${{ github.event.inputs.month }}"
          else
            python scrape.py
          fi

      - name: Commit updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Update events.json"
          git push
