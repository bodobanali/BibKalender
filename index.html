<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berliner Bibliotheken – Veranstaltungen</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: #e2ddd0;
    --text: #2c2c2a;
    --text-secondary: #6b6963;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 2.5rem 1.5rem 1rem;
    max-width: 900px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 0.5rem;
  }
  header p {
    color: var(--text-secondary);
    font-size: 15px;
    margin: 0.25rem 0;
  }
  .note {
    background: var(--accent-bg);
    color: #0c447c;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 14px;
    margin-top: 1rem;
  }
  .controls {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.5rem 1.5rem 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
  }
  .toggle-group {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle-group button {
    border: none;
    background: var(--card);
    padding: 0.5rem 1rem;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .toggle-group button.active {
    background: var(--accent);
    color: #fff;
  }
  .month-select-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .month-select-wrap label {
    font-size: 13px;
    color: var(--text-secondary);
  }
  select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    font-size: 14px;
    background: var(--card);
    color: var(--text);
  }
  .month-hint {
    font-size: 12px;
    color: var(--text-secondary);
    max-width: 900px;
    margin: 0 auto 1rem;
    padding: 0 1.5rem;
  }
  .filter-row {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .filter-row input {
    width: 16px;
    height: 16px;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  .section {
    margin-bottom: 2.5rem;
  }
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--border);
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
  }
  .section-header h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  .section-header .count {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .event-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1.1rem;
    margin-bottom: 0.6rem;
    display: flex;
    gap: 0.9rem;
    align-items: flex-start;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease;
  }
  .event-card:hover {
    border-color: var(--accent);
  }
  .event-when {
    flex: 0 0 auto;
    min-width: 92px;
    background: var(--accent-bg);
    color: #0c447c;
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    text-align: center;
    line-height: 1.3;
  }
  .event-when .date {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.85;
  }
  .event-when .time {
    font-weight: 700;
    font-size: 17px;
    margin-top: 0.15rem;
  }
  .event-when.swap .date {
    font-size: 17px;
    font-weight: 700;
    opacity: 1;
  }
  .event-when.swap .time {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.85;
    margin-top: 0.15rem;
  }
  .event-body {
    flex: 1 1 auto;
    min-width: 0;
  }
  .event-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 0.4rem;
  }
  .event-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0 0 0.35rem;
  }
  .library-badge {
    display: inline-block;
    background: #f0997b33;
    color: #712b13;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 6px;
    padding: 0.15rem 0.5rem;
  }
  .recurring-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: #97c45940;
    color: #27500a;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 6px;
    padding: 0.15rem 0.5rem;
  }
  .location-text {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .event-desc {
    font-size: 13.5px;
    color: var(--text-secondary);
    margin: 0;
  }
  .state-msg {
    font-size: 14px;
    color: var(--text-secondary);
    padding: 2rem 0;
    text-align: center;
  }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<header>
  <h1>Berliner Bibliotheken – Veranstaltungen</h1>
  <p id="statusLine">Lade Daten…</p>
  <div class="note">
    Jede Veranstaltung verlinkt direkt auf die VA-Detailseite bei berlin.de. Die Daten werden regelmäßig automatisch über GitHub Actions aktualisiert.
  </div>
</header>

<div class="controls">
  <div class="toggle-group" id="viewToggle">
    <button data-view="date" class="active">Nach Datum</button>
    <button data-view="library">Nach Bibliothek</button>
  </div>
  <div class="month-select-wrap">
    <label for="monthSelect">Monat</label>
    <select id="monthSelect"></select>
  </div>
</div>
<p class="month-hint" id="monthHint"></p>

<div class="filter-row">
  <input type="checkbox" id="hideRecurring">
  <label for="hideRecurring">Wiederkehrende Veranstaltungen ausblenden</label>
</div>

<main id="eventsContainer"><p class="state-msg">Lade Veranstaltungen…</p></main>

<footer id="footerText"></footer>

<script>
const weekdays = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const months = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function formatDayHeading(iso) {
  const d = new Date(iso + "T00:00:00");
  return weekdays[d.getDay()] + ", " + d.getDate() + ". " + months[d.getMonth()] + " " + d.getFullYear();
}

function renderEventCard(e, swap) {
  return `<a class="event-card" href="${e.link}" target="_blank" rel="noopener">
    <div class="event-when${swap ? " swap" : ""}">
      <div class="date">${e.dateLabel}</div>
      ${e.time ? `<div class="time">${e.time}</div>` : ""}
    </div>
    <div class="event-body">
      <p class="event-title">${e.title}</p>
      <p class="event-meta">
        <span class="library-badge">${e.library.replace("Stadtbibliothek ", "")}</span>
        ${e.recurring ? `<span class="recurring-badge">wiederkehrend</span>` : ""}
        <span class="location-text">${e.location}</span>
      </p>
      ${e.desc ? `<p class="event-desc">${e.desc}</p>` : ""}
    </div>
  </a>`;
}

let allEvents = [];
let currentView = "date";
const container = document.getElementById("eventsContainer");
const toggleButtons = document.querySelectorAll("#viewToggle button");

function currentEvents() {
  const hideRecurring = document.getElementById("hideRecurring").checked;
  return hideRecurring ? allEvents.filter(e => !e.recurring) : allEvents;
}

function renderByDate() {
  const sorted = [...currentEvents()].sort((a, b) => a.date.localeCompare(b.date) || (a.time||"").localeCompare(b.time||""));
  if (!sorted.length) return `<p class="state-msg">Keine Veranstaltungen für diese Auswahl.</p>`;
  const groups = {};
  sorted.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
  return Object.keys(groups).sort().map(date => `
    <div class="section">
      <div class="section-header"><h2>${formatDayHeading(date)}</h2><span class="count">${groups[date].length} Veranstaltung${groups[date].length !== 1 ? "en" : ""}</span></div>
      ${groups[date].map(e => renderEventCard(e, false)).join("")}
    </div>
  `).join("");
}

function renderByLibrary() {
  const evts = currentEvents();
  if (!evts.length) return `<p class="state-msg">Keine Veranstaltungen für diese Auswahl.</p>`;
  const groups = {};
  evts.forEach(e => { (groups[e.library] = groups[e.library] || []).push(e); });
  return Object.keys(groups).sort().map(lib => {
    const sorted = [...groups[lib]].sort((a, b) => a.date.localeCompare(b.date) || (a.time||"").localeCompare(b.time||""));
    return `
    <div class="section">
      <div class="section-header"><h2>${lib}</h2><span class="count">${sorted.length} Veranstaltung${sorted.length !== 1 ? "en" : ""}</span></div>
      ${sorted.map(e => renderEventCard(e, true)).join("")}
    </div>
  `;
  }).join("");
}

function render() {
  container.innerHTML = currentView === "library" ? renderByLibrary() : renderByDate();
  toggleButtons.forEach(b => b.classList.toggle("active", b.dataset.view === currentView));
}

toggleButtons.forEach(btn => {
  btn.addEventListener("click", () => { currentView = btn.dataset.view; render(); });
});
document.getElementById("hideRecurring").addEventListener("change", render);

fetch("events.json?_=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("events.json nicht gefunden");
    return r.json();
  })
  .then(data => {
    allEvents = data.events || [];
    const status = document.getElementById("statusLine");
    const generated = data.generatedAt ? new Date(data.generatedAt).toLocaleString("de-DE") : "unbekannt";
    status.textContent = `${data.monthLabel || ""} · zuletzt aktualisiert ${generated}`;

    const select = document.getElementById("monthSelect");
    select.innerHTML = `<option value="${data.month}" selected>${data.monthLabel}</option>`;
    document.getElementById("monthHint").textContent =
      "Aktuell wird nur der oben angezeigte Monat automatisch aktualisiert (per GitHub Actions).";

    const missing = (data.unsupportedLibraries || []).join(", ");
    document.getElementById("footerText").textContent =
      "Quelle: zentraler Veranstaltungskalender von berlin.de." +
      (missing ? ` Noch nicht zuverlässig erfassbar: ${missing}.` : "");

    render();
  })
  .catch(err => {
    document.getElementById("statusLine").textContent = "Daten konnten nicht geladen werden.";
    container.innerHTML = `<p class="state-msg">Fehler beim Laden von events.json: ${err.message}</p>`;
  });
</script>

</body>
</html>
